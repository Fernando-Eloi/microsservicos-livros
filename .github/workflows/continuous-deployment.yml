name: Microservices Continuous Deployment with Github Actions

on:
  push:
    branches:
      - "main"
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4



      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME }}
          password: ${{secrets.DOCKER_ACCESS_TOKEN }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '21'

      - name: Build Eureka Naming Server Docker Image
        working-directory: naming-server/naming-server
        run: mvn spring-boot:build-image

      - name: Build API Gateway Docker Image
        working-directory: api-gateway/api-gateway
        run: mvn spring-boot:build-image

      - name: Build Exchange Microservice Docker Image
        working-directory: exchange-service/exchange-service
        run: mvn clean package

      - name: Build Book Microservice Docker Image
        working-directory: book-service/book-service
        run: mvn clean package

      - name: Docker Compose Build
        run: docker compose build

      - name: Tag Docker Images
        run: |
          docker tag fernandodelima/naming-server:0.0.1-SNAPSHOT ${{ secrets.DOCKER_USERNAME }}/naming-server:latest
          docker tag fernandodelima/naming-server:0.0.1-SNAPSHOT ${{ secrets.DOCKER_USERNAME }}/naming-server:${{ github.run_id }}
          docker tag fernandodelima/api-gateway:0.0.1-SNAPSHOT ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest
          docker tag fernandodelima/api-gateway:0.0.1-SNAPSHOT ${{ secrets.DOCKER_USERNAME }}/api-gateway:${{ github.run_id }}
          docker tag fernandodelima/book-service:0.0.1-SNAPSHOT ${{ secrets.DOCKER_USERNAME }}/book-service:latest
          docker tag fernandodelima/book-service:0.0.1-SNAPSHOT ${{ secrets.DOCKER_USERNAME }}/book-service:${{ github.run_id }}
          docker tag fernandodelima/exchange-service:0.0.1-SNAPSHOT ${{ secrets.DOCKER_USERNAME }}/exchange-service:latest
          docker tag fernandodelima/exchange-service:0.0.1-SNAPSHOT ${{ secrets.DOCKER_USERNAME }}/exchange-service:${{ github.run_id }}
      

      - name: Push Docker Images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/naming-server:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/naming-server:${{ github.run_id }}
          docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:${{ github.run_id }}
          docker push ${{ secrets.DOCKER_USERNAME }}/book-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/book-service:${{ github.run_id }}
          docker push ${{ secrets.DOCKER_USERNAME }}/exchange-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/exchange-service:${{ github.run_id }}